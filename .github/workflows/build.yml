name: Build 46 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          echo "ZIP_FILE=$ZIP_FILE"

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          rm -rf build_project
          mkdir -p build_project

          unzip -o "$ZIP_FILE" -d build_project

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find build_project -type f -name "settings.gradle*" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            find build_project -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project: $PROJECT_DIR"

      - name: Fix JVM target
        shell: bash
        run: |
          set -e

          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$PROJECT_DIR/app/build.gradle" || true

          sed -i 's/jvmTarget *= *["'\'']1\.8["'\'']/jvmTarget = "17"/g' "$PROJECT_DIR/app/build.gradle" || true

          echo "JVM target fixed"

      - name: Fix OkHttp imports
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_DIR/app/src/main/java/com/example/fortysix/MainActivity.kt"

          if [ -f "$FILE" ]; then

            grep -q "RequestBody.Companion.toRequestBody" "$FILE" || \
              sed -i '/^package /a import okhttp3.RequestBody.Companion.toRequestBody' "$FILE"

            grep -q "MediaType.Companion.toMediaType" "$FILE" || \
              sed -i '/^package /a import okhttp3.MediaType.Companion.toMediaType' "$FILE"

            echo "OkHttp imports checked"

          else

            echo "MainActivity.kt not found"
            exit 1

          fi

      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 46-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
